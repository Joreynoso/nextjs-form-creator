name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    name: Automated Release and AI Notes
    steps:
      # Genera un Release PR o crea una GitHub Release cuando se fusiona el PR
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          target-branch: master
          # El tipo node actualizará el package.json y generará el CHANGELOG.md automáticamente
          release-type: node

      # Generar notas de release con IA en castellano si se ha creado una release (POST-RELEASE)
      - name: Generate AI Release Notes (Spanish)
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYSTEM_PROMPT: |
            Eres un redactor técnico experto. A partir de la lista de cambios que te proporciono, 
            genera notas de release en castellano, bien estructuradas y profesionales.
            Incluye un resumen breve de 1 o 2 líneas al inicio y secciones para:
            - Funcionalidades
            - Correcciones de bugs
            - Otros cambios
            Usa un tono cercano pero profesional.
        with:
          script: |
            const releaseTag = '${{ steps.release.outputs.tag_name }}';
            const releaseBody = `${{ steps.release.outputs.body }}`;
            const releaseId = '${{ steps.release.outputs.id }}';
            
            if (!process.env.GEMINI_API_KEY) {
              console.warn("⚠️ No se encontró GEMINI_API_KEY. Las notas de la release se mantendrán en el formato estándar.");
              return;
            }

            console.log(`🚀 Procesando cambios para la versión ${releaseTag}...`);

            try {
              // Utilizamos el campo system_instruction para el rol de sistema
              // y el campo contents para la petición específica del usuario
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  system_instruction: {
                    parts: [{ text: process.env.SYSTEM_PROMPT }]
                  },
                  contents: [{ 
                    role: 'user', 
                    parts: [{ text: `Genera las notas del release en castellano para la versión ${releaseTag} basándote en el siguiente listado de cambios:\n\n${releaseBody}` }] 
                  }]
                })
              });

              if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
              
              const data = await response.json();
              const aiNotes = data.candidates[0].content.parts[0].text;

              console.log("✅ Notas generadas correctamente por la IA.");

              // Actualizamos la release de GitHub con las notas traducidas y mejoradas
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(releaseId),
                body: aiNotes
              });

            } catch (error) {
              console.error("❌ Error al generar o actualizar las notas con IA:", error);
            }
