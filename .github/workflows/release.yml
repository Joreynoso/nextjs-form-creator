name: Release Please

on:
  push:
    branches:
      - master   # Cambia a main si tu repo usa main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    name: Automated Release PR and AI Notes
    steps:
      # Crea un Release PR sin hacer merge ni release automático
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: master
          release-type: node
          create-release: false   # <--- importante para PR manual

      # Generar notas de release con IA basadas en el PR de release
      - name: Generate AI Release Notes (Spanish)
        if: ${{ steps.release.outputs.pull_request_url }}
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYSTEM_PROMPT: |
            Eres un redactor técnico experto. A partir de la lista de cambios que te proporciono, 
            genera notas de release en castellano, bien estructuradas y profesionales.
            Incluye un resumen breve de 1 o 2 líneas al inicio y secciones para:
            - Funcionalidades
            - Correcciones de bugs
            - Otros cambios
            Usa un tono cercano pero profesional.
        with:
          script: |
            const prUrl = '${{ steps.release.outputs.pull_request_url }}'
            const releaseBody = `${{ steps.release.outputs.body }}`
            
            if (!process.env.GEMINI_API_KEY) {
              console.warn("⚠️ No se encontró GEMINI_API_KEY. Las notas se mantendrán en formato estándar.");
              return;
            }

            console.log(`🚀 Generando notas de IA para el PR de release ${prUrl}...`);

            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  system_instruction: { parts: [{ text: process.env.SYSTEM_PROMPT }] },
                  contents: [{ 
                    role: 'user', 
                    parts: [{ text: `Genera las notas del release basándote en el siguiente listado de cambios:\n\n${releaseBody}` }] 
                  }]
                })
              })

              if (!response.ok) throw new Error(`API Error: ${response.statusText}`)
              
              const data = await response.json()
              const aiNotes = data.candidates[0].content.parts[0].text
              console.log("✅ Notas generadas correctamente por la IA:\n", aiNotes)

              // Comentar las notas de IA directamente en el PR de release
              const prNumber = parseInt(prUrl.split('/').pop())
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `### Notas de release generadas por IA\n\n${aiNotes}`
              })

            } catch (error) {
              console.error("❌ Error al generar o actualizar las notas con IA:", error)
            }
